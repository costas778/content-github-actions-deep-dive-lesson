name: Deploy Lambda Function

on:
  push:
    branches: [lab]  # make sure this matches your active branch

permissions:
  contents: write      # needed for creating releases and uploading assets
  id-token: write      # optional for future OIDC integrations (e.g., AWS deploy)

jobs:
# ------------------------------- LINT ---------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install flake8
        run: pip install flake8

      - name: Flake8 – fail on errors
        run: |
          cd function
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Flake8 – full report
        run: |
          cd function
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

# ------------------------------- BUILD --------------------------------
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          cd function
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt -t .; fi

      - name: Package Lambda code
        run: |
          cd function
          zip -r ../lambda_bundle_${{ github.sha }}.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-bundle
          path: lambda_bundle_${{ github.sha }}.zip

# ------------------------------ PUBLISH -------------------------------
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-bundle
          path: .

      - name: Create GitHub Release + upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: Release ${{ github.run_number }}
          body: Release for commit ${{ github.sha }}
          files: lambda_bundle_${{ github.sha }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
